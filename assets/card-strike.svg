<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-label="StrikeSense: Real-time Muay Thai telemetry: 400 Hz strike sensors and AI analysis.">
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.tr{fill:none;stroke:#14507c;stroke-width:2.5;stroke-linejoin:round}
.pu{fill:none;stroke:#5fc4ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:26 900;animation:run var(--t,4s) linear infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 5px #5fc4ee)}
.via{fill:#06121d;stroke:#f5c451;stroke-width:2.5}
@keyframes run{from{stroke-dashoffset:926}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes slide{to{transform:translateX(-120px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-92px);opacity:0}}
@keyframes drop{0%{transform:translateX(-70px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0) scale(.2);opacity:0}}
@keyframes type{from{width:0}to{width:560px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes slide{to{transform:translateX(-100px)}}</style>
<rect width="590" height="230" rx="14" fill="#0a1c2c" stroke="#14507c" stroke-width="2"/>
<circle class="via" cx="14" cy="14" r="4"/>
<circle class="via" cx="576" cy="14" r="4"/>
<circle class="via" cx="14" cy="216" r="4"/>
<circle class="via" cx="576" cy="216" r="4"/>
<text x="34" y="50" fill="#f5c451" font-size="14" font-weight="700">U2</text>
<text x="34" y="90" fill="#e8f4fc" font-size="30" font-weight="800">StrikeSense</text>
<text x="34" y="124" fill="#a9c3d6" font-size="15">Real-time Muay Thai telemetry: 400 Hz</text>
<text x="34" y="146" fill="#a9c3d6" font-size="15">strike sensors and AI analysis.</text>
<rect x="34" y="184" width="82" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="43" y="202" fill="#5fc4ee" font-size="13">ESP32-S3</text>
<rect x="124" y="184" width="66" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="133" y="202" fill="#5fc4ee" font-size="13">BMI160</text>
<rect x="198" y="184" width="34" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="207" y="202" fill="#5fc4ee" font-size="13">ML</text>
<g transform="translate(415 10)"><clipPath id="k"><rect x="5" y="30" width="140" height="150"/></clipPath><g clip-path="url(#k)"><path d="M5 105 l18 0 l6 -8 l6 8 l10 0 l6 -58 l8 100 l6 -42 l18 0 l18 0 l6 -8 l6 8 l10 0 l6 -58 l8 100 l6 -42 l18 0 l18 0 l6 -8 l6 8 l10 0 l6 -58 l8 100 l6 -42 l18 0 l18 0 l6 -8 l6 8 l10 0 l6 -58 l8 100 l6 -42 l18 0 l18 0 l6 -8 l6 8 l10 0 l6 -58 l8 100 l6 -42 l18 0 " fill="none" stroke="#ff9f43" stroke-width="3" style="animation:slide 2s linear infinite;--x:0"/></g></g>
</svg>
