<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-label="SKR-SMS: Serverless school management with three-level roles.">
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.tr{fill:none;stroke:#14507c;stroke-width:2.5;stroke-linejoin:round}
.pu{fill:none;stroke:#5fc4ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:26 900;animation:run var(--t,4s) linear infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 5px #5fc4ee)}
.via{fill:#06121d;stroke:#f5c451;stroke-width:2.5}
@keyframes run{from{stroke-dashoffset:926}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes slide{to{transform:translateX(-120px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-92px);opacity:0}}
@keyframes drop{0%{transform:translateX(-70px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0) scale(.2);opacity:0}}
@keyframes type{from{width:0}to{width:560px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="590" height="230" rx="14" fill="#0a1c2c" stroke="#14507c" stroke-width="2"/>
<circle class="via" cx="14" cy="14" r="4"/>
<circle class="via" cx="576" cy="14" r="4"/>
<circle class="via" cx="14" cy="216" r="4"/>
<circle class="via" cx="576" cy="216" r="4"/>
<text x="34" y="50" fill="#f5c451" font-size="14" font-weight="700">U7</text>
<text x="34" y="90" fill="#e8f4fc" font-size="30" font-weight="800">SKR-SMS</text>
<text x="34" y="124" fill="#a9c3d6" font-size="15">Serverless school management with three-</text>
<text x="34" y="146" fill="#a9c3d6" font-size="15">level roles.</text>
<rect x="34" y="184" width="82" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="43" y="202" fill="#5fc4ee" font-size="13">Firebase</text>
<rect x="124" y="184" width="42" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="133" y="202" fill="#5fc4ee" font-size="13">SPA</text>
<rect x="174" y="184" width="50" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="183" y="202" fill="#5fc4ee" font-size="13">RBAC</text>
<g transform="translate(415 10)"><path d="M75 50L35 110" stroke="#14507c" stroke-width="2.5"/><path d="M75 50L115 110" stroke="#14507c" stroke-width="2.5"/><path d="M35 110L20 170" stroke="#14507c" stroke-width="2.5"/><path d="M35 110L60 170" stroke="#14507c" stroke-width="2.5"/><path d="M115 110L100 170" stroke="#14507c" stroke-width="2.5"/><path d="M115 110L130 170" stroke="#14507c" stroke-width="2.5"/><circle cx="75" cy="50" r="11" fill="#5fc4ee" style="animation:breathe 2.4s 0.0s infinite"/><circle cx="35" cy="110" r="8" fill="#5fc4ee" style="animation:breathe 2.4s 0.25s infinite"/><circle cx="115" cy="110" r="8" fill="#5fc4ee" style="animation:breathe 2.4s 0.5s infinite"/><circle cx="20" cy="170" r="8" fill="#5fc4ee" style="animation:breathe 2.4s 0.75s infinite"/><circle cx="60" cy="170" r="8" fill="#5fc4ee" style="animation:breathe 2.4s 1.0s infinite"/><circle cx="100" cy="170" r="8" fill="#5fc4ee" style="animation:breathe 2.4s 1.25s infinite"/><circle cx="130" cy="170" r="8" fill="#5fc4ee" style="animation:breathe 2.4s 1.5s infinite"/></g>
</svg>
