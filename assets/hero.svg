<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Supachok, a.k.a. Pluem. I build things that leave the screen.">
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.tr{fill:none;stroke:#14507c;stroke-width:2.5;stroke-linejoin:round}
.pu{fill:none;stroke:#5fc4ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:26 900;animation:run var(--t,4s) linear infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 5px #5fc4ee)}
.via{fill:#06121d;stroke:#f5c451;stroke-width:2.5}
@keyframes run{from{stroke-dashoffset:926}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes slide{to{transform:translateX(-120px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-92px);opacity:0}}
@keyframes drop{0%{transform:translateX(-70px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0) scale(.2);opacity:0}}
@keyframes type{from{width:0}to{width:560px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
