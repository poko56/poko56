<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-label="Hydroponic OS: One ESP32 runs a vertical farm with dual-pump failover.">
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.tr{fill:none;stroke:#14507c;stroke-width:2.5;stroke-linejoin:round}
.pu{fill:none;stroke:#5fc4ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:26 900;animation:run var(--t,4s) linear infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 5px #5fc4ee)}
.via{fill:#06121d;stroke:#f5c451;stroke-width:2.5}
@keyframes run{from{stroke-dashoffset:926}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes slide{to{transform:translateX(-120px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-92px);opacity:0}}
@keyframes drop{0%{transform:translateX(-70px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0) scale(.2);opacity:0}}
@keyframes type{from{width:0}to{width:560px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="590" height="230" rx="14" fill="#0a1c2c" stroke="#14507c" stroke-width="2"/>
<circle class="via" cx="14" cy="14" r="4"/>
<circle class="via" cx="576" cy="14" r="4"/>
<circle class="via" cx="14" cy="216" r="4"/>
<circle class="via" cx="576" cy="216" r="4"/>
<text x="34" y="50" fill="#f5c451" font-size="14" font-weight="700">U5</text>
<text x="34" y="90" fill="#e8f4fc" font-size="30" font-weight="800">Hydroponic OS</text>
<text x="34" y="124" fill="#a9c3d6" font-size="15">One ESP32 runs a vertical farm with</text>
<text x="34" y="146" fill="#a9c3d6" font-size="15">dual-pump failover.</text>
<rect x="34" y="184" width="58" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="43" y="202" fill="#5fc4ee" font-size="13">ESP32</text>
<rect x="100" y="184" width="50" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="109" y="202" fill="#5fc4ee" font-size="13">OLED</text>
<rect x="158" y="184" width="66" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="167" y="202" fill="#5fc4ee" font-size="13">Web UI</text>
<g transform="translate(415 10)"><rect x="50" y="30" width="50" height="150" rx="8" fill="#0d2233" stroke="#35e08f" stroke-width="2"/><circle cx="62.0" cy="172" r="3" fill="#5fc4ee" style="animation:rise 3s 0.0s linear infinite"/><circle cx="67.5" cy="172" r="4" fill="#5fc4ee" style="animation:rise 3s 0.5s linear infinite"/><circle cx="73.0" cy="172" r="5" fill="#5fc4ee" style="animation:rise 3s 1.0s linear infinite"/><circle cx="78.5" cy="172" r="3" fill="#5fc4ee" style="animation:rise 3s 1.5s linear infinite"/><circle cx="84.0" cy="172" r="4" fill="#5fc4ee" style="animation:rise 3s 2.0s linear infinite"/><circle cx="89.5" cy="172" r="5" fill="#5fc4ee" style="animation:rise 3s 2.5s linear infinite"/><path d="M50 60q-22 -4 -28 -20q20 0 28 20M100 60q22 -4 28 -20q-20 0 -28 20" fill="#35e08f"/><path d="M50 100q-22 -4 -28 -20q20 0 28 20M100 100q22 -4 28 -20q-20 0 -28 20" fill="#35e08f"/><path d="M50 140q-22 -4 -28 -20q20 0 28 20M100 140q22 -4 28 -20q-20 0 -28 20" fill="#35e08f"/></g>
</svg>
