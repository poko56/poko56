<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-label="Hotel Power: Room-level power monitor with instant Telegram alerts on faults.">
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.tr{fill:none;stroke:#14507c;stroke-width:2.5;stroke-linejoin:round}
.pu{fill:none;stroke:#5fc4ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:26 900;animation:run var(--t,4s) linear infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 5px #5fc4ee)}
.via{fill:#06121d;stroke:#f5c451;stroke-width:2.5}
@keyframes run{from{stroke-dashoffset:926}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes slide{to{transform:translateX(-120px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-92px);opacity:0}}
@keyframes drop{0%{transform:translateX(-70px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0) scale(.2);opacity:0}}
@keyframes type{from{width:0}to{width:560px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="590" height="230" rx="14" fill="#0a1c2c" stroke="#14507c" stroke-width="2"/>
<circle class="via" cx="14" cy="14" r="4"/>
<circle class="via" cx="576" cy="14" r="4"/>
<circle class="via" cx="14" cy="216" r="4"/>
<circle class="via" cx="576" cy="216" r="4"/>
<text x="34" y="50" fill="#f5c451" font-size="14" font-weight="700">U4</text>
<text x="34" y="90" fill="#e8f4fc" font-size="30" font-weight="800">Hotel Power</text>
<text x="34" y="124" fill="#a9c3d6" font-size="15">Room-level power monitor with instant</text>
<text x="34" y="146" fill="#a9c3d6" font-size="15">Telegram alerts on faults.</text>
<rect x="34" y="184" width="58" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="43" y="202" fill="#5fc4ee" font-size="13">ESP32</text>
<rect x="100" y="184" width="74" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="109" y="202" fill="#5fc4ee" font-size="13">ESP8266</text>
<rect x="182" y="184" width="74" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="191" y="202" fill="#5fc4ee" font-size="13">ESP-NOW</text>
<rect x="264" y="184" width="82" height="26" rx="5" fill="#0d2233" stroke="#14507c"/>
<text x="273" y="202" fill="#5fc4ee" font-size="13">Telegram</text>
<g transform="translate(415 10)"><rect x="15" y="45" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 0.0s infinite"/><rect x="46" y="45" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 0.3s infinite"/><rect x="77" y="45" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 0.6s infinite"/><rect x="108" y="45" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 0.8999999999999999s infinite"/><rect x="15" y="76" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 0.3s infinite"/><rect x="46" y="76" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 3s 0.6s infinite"/><rect x="77" y="76" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 4s 0.8999999999999999s infinite"/><rect x="108" y="76" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 1.2s infinite"/><rect x="15" y="107" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 0.6s infinite"/><rect x="46" y="107" width="24" height="24" rx="4" fill="#ff5d5d" style="animation:blink .8s infinite"/><rect x="77" y="107" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 3s 1.2s infinite"/><rect x="108" y="107" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 1.5s infinite"/><rect x="15" y="138" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 0.8999999999999999s infinite"/><rect x="46" y="138" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 1.2s infinite"/><rect x="77" y="138" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 1.5s infinite"/><rect x="108" y="138" width="24" height="24" rx="4" fill="#35e08f" style="animation:breathe 2s 1.7999999999999998s infinite"/></g>
</svg>
